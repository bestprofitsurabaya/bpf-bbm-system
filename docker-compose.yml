services:
  db:
    image: mariadb:10.11
    container_name: bbm_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: password_db
      MYSQL_DATABASE: bpf_asset_system
      MYSQL_USER: bpf_user
      MYSQL_PASSWORD: bpf_pass
      TZ: Asia/Jakarta
    ports:
      - "3307:3306"
    volumes:
      - bbm_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bpf_user", "-pbpf_pass"]
      timeout: 10s
      retries: 5
    networks:
      - default

  web:
    build: .
    container_name: bbm_web
    ports:
      - "5001:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./static:/app/static
    environment:
      - FLASK_DEBUG=0
      - TZ=Asia/Jakarta
      - DB_HOST=db
      - DB_USER=bpf_user
      - DB_PASSWORD=bpf_pass
      # Akses HTTP polos (localhost/dev) di browser TIDAK mengirim cookie Secure.
      # Hanya aktifkan baris di bawah saat mengakses via HTTP lokal saja —
      # biarkan nonaktif di produksi (HTTPS) demi keamanan (ISO/IEC 27001).
      # - SESSION_COOKIE_SECURE=false
      - DB_NAME=bpf_asset_system
      - DB_POOL_SIZE=15
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY wajib di .env}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default            # Terhubung ke bbm_mariadb
      - nextcloud_net      # Terhubung ke nextcloud_nginx

  # ------------------------------------------------------------
  # CLOUDFLARE TUNNEL (AKSES CADANGAN — NONAKTIF SEJAK v1.2.3)
  # ------------------------------------------------------------
  # Produksi memakai DuckDNS + nginx (https://nasbpfsby.duckdns.org:5000),
  # jadi service ini sengaja di-comment agar tidak boros resource.
  # Untuk mengaktifkan kembali: hapus tanda # di bawah, lalu jalankan
  #   docker compose up -d cloudflared
  #
  # MODE 1 — Quick Tunnel (trycloudflare.com): tanpa token, URL acak
  #   https://xxx.trycloudflare.com, berubah tiap restart (cocok uji coba).
  # MODE 2 — Named tunnel + domain sendiri (URL permanen):
  #   1. Dashboard Cloudflare → Zero Trust → Networks → Tunnels → Create
  #   2. Salin token eyJ... , lalu ubah command menjadi:
  #      command: tunnel --no-autoupdate run --token PASTE_TOKEN_DI_SINI
  #   3. Tambahkan route public (hostname → http://web:5000)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: bbm_cloudflared
  #   command: tunnel --no-autoupdate --url http://web:5000
  #   depends_on:
  #     - web
  #   restart: unless-stopped
  #   networks:
  #     - default

  redis:
    image: redis:7-alpine
    container_name: bbm_redis
    restart: unless-stopped
    command: redis-server --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - bbm_redis_data:/data

volumes:
  bbm_db_data:
  bbm_redis_data:

networks:
  default:
  nextcloud_net:
    external: true
    name: nextcloud_net