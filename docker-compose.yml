services:
  db:
    image: mariadb:10.11
    container_name: bbm_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: password_db
      MYSQL_DATABASE: bpf_asset_system
      MYSQL_USER: bpf_user
      MYSQL_PASSWORD: bpf_pass
      TZ: Asia/Jakarta
    ports:
      - "3307:3306"
    volumes:
      - bbm_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bpf_user", "-pbpf_pass"]
      timeout: 10s
      retries: 5
    networks:
      - default

  web:
    build: .
    container_name: bbm_web
    ports:
      - "5001:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./static:/app/static
    environment:
      - FLASK_DEBUG=0
      - TZ=Asia/Jakarta
      - DB_HOST=db
      - DB_USER=bpf_user
      - DB_PASSWORD=bpf_pass
      - DB_NAME=bpf_asset_system
      - DB_POOL_SIZE=15
      - SECRET_KEY=bpf_bbm_super_secret_production_key_2026_indonesia
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default            # Terhubung ke bbm_mariadb
      - nextcloud_net      # Terhubung ke nextcloud_nginx

  # ------------------------------------------------------------
  # CLOUDFLARE TUNNEL (online tanpa port forwarding)
  # ------------------------------------------------------------
  # MODE SAAT INI: Quick Tunnel (trycloudflare.com) — tanpa token,
  # URL acak https://xxx.trycloudflare.com, berubah tiap restart.
  # Cocok untuk uji coba.
  #
  # UPGRADE KE URL PERMANEN (named tunnel + domain sendiri):
  #   1. Dashboard Cloudflare → Zero Trust → Networks → Tunnels → Create
  #   2. Salin token eyJ... , lalu ubah command di bawah menjadi:
  #      command: tunnel --no-autoupdate run --token PASTE_TOKEN_DI_SINI
  #   3. Tambahkan route public (hostname → http://web:5000)
  #   4. docker compose up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bbm_cloudflared
    command: tunnel --no-autoupdate --url http://web:5000
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - default

volumes:
  bbm_db_data:
  
networks:
  default:
  nextcloud_net:
    external: true
    name: nextcloud_net